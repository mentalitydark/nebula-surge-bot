name: Build

on:
  pull_request:
    branches:
      ["master", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Using Node.js v25
        uses: actions/setup-node@v3
        with:
          node-version: 25.
      - name: Install dependencies
        run: |
          npm install
          npm run build